<!-- favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Bigger stopwatch ring -->
  <circle
    cx="32"
    cy="34"
    r="22"
    fill="none"
    stroke="#7c6af7"
    stroke-width="4"
  />

  <!-- Top button -->
  <rect
    x="26"
    y="2"
    width="12"
    height="10"
    rx="3"
    fill="#7c6af7"
  />

  <!-- Side button -->
  <rect
    x="46"
    y="10"
    width="8"
    height="5"
    rx="1.5"
    transform="rotate(45 50 12)"
    fill="#7c6af7"
  />

  <!-- Clock hands -->
  <line
    x1="32"
    y1="34"
    x2="32"
    y2="20"
    stroke="#e8e8f0"
    stroke-width="4"
    stroke-linecap="round"
  />

  <line
    x1="32"
    y1="34"
    x2="44"
    y2="40"
    stroke="#e8e8f0"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Center dot -->
  <circle cx="32" cy="34" r="3.5" fill="#7c6af7"/>
</svg>